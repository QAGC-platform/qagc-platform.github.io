openapi: 3.1.0
info:
  title: QAGC Assistant API
  description: >
    Reads the QAGC annual plan and pushes proposed tasks into the platform's
    inbox. Everything pushed is pending until the Director General approves it.
  version: 1.0.0
servers:
  # the live deployment — no /exec here; the path below adds it
  - url: https://script.google.com/macros/s/AKfycbyXcZmRRwTd3l9RxsVervXq2waQ6SLyZ8uVQ83H9RuBFJZupisg_s1-5R8wvPQmQIQxgg
paths:
  /exec:
    get:
      operationId: readPlatform
      summary: Read the plan objectives, the inbox, or ping the service.
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
          description: The platform-issued API key (given in the GPT instructions).
        - name: fn
          in: query
          required: true
          schema: { type: string, enum: [ping, objectives, inbox, analysis] }
          description: >
            analysis يعيد طابور طلبات تحليل المؤشرات المرسلة من المنصة —
            كل صف فيه kpi وquestion وdata (سلسلة القراءات JSON) وid.
      responses:
        "200":
          description: JSON result.
    post:
      operationId: pushTask
      summary: >
        Push ONE package — an objective together with its KPIs and optional
        budget — into the platform inbox (lands as pending). Never push the
        KPIs of an objective as separate calls; they belong in the kpis array
        of the same call.
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, tag]
              properties:
                fn:
                  type: string
                  enum: [addTask, addCpd, answerAnalysis]
                  default: addTask
                  description: >
                    addTask لحزمة هدف/مهمة؛ addCpd لنشاط تطوير مهني يذهب مباشرة
                    إلى لوحة CPD (يلزم title وdue وctype)؛ answerAnalysis لكتابة
                    تحليل مؤشر (يلزم id من طابور analysis وحقل answer).
                title: { type: string, description: "عنوان الهدف أو المهمة بالعربية" }
                kind:
                  type: string
                  enum: [objective, task, agenda, pdp]
                  description: >
                    ما نوع المدفوع — objective لحزمة هدف بمؤشراتها؛ task لمهمة
                    بسيطة؛ agenda لجدول أعمال اجتماع (بنوده في note بنداً في
                    كل سطر)؛ pdp لخطة تطوير شخصية لموظف بعينه (اسمه الكامل في
                    owner وعناصرها في note عنصراً في كل سطر). إلزامي مع addTask.
                smart:
                  type: string
                  description: >
                    الصياغة الذكية SMART كاملة إن كان هدفاً (اختياري) —
                    وإن كانت مهمة مباشرة فاتركه فارغاً.
                kpis:
                  type: array
                  maxItems: 10
                  description: مؤشرات الأداء المرتبطة بهذا الهدف — تُرسل معه في النداء نفسه
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, description: "اسم المؤشر" }
                      target: { type: string, description: "المستهدف، مثل 80%" }
                      unit: { type: string, description: "وحدة القياس" }
                tag:
                  type: string
                  enum: [five_year_plan, annual_plan, third_category]
                  description: التصنيف — إلزامي، لا تُقبل مهمة بلا فئة
                owner: { type: string, description: "الجهة أو الشخص المقترح" }
                due: { type: string, description: "YYYY-MM-DD" }
                budget: { type: number, description: "تقدير بالريال العماني، إن وجد" }
                note: { type: string }
                ctype:
                  type: string
                  enum: [lecture, workshop, webinar, forum]
                  description: نوع نشاط CPD — إلزامي مع addCpd فقط
                venue: { type: string, description: "مكان نشاط CPD (اختياري)" }
                date_to: { type: string, description: "نهاية نشاط CPD إن امتد أياماً، YYYY-MM-DD" }
                id: { type: string, description: "معرّف طلب التحليل — مع answerAnalysis فقط" }
                answer: { type: string, description: "نص التحليل بالعربية — مع answerAnalysis فقط" }
      responses:
        "200":
          description: JSON result with state pending.
